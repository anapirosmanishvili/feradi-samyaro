<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ფერადი კურდღელი</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@500;700;900&display=swap">
<style>
/* Layout: one-screen crayon box. Paper sheet in the middle, a tray of fat crayons along the bottom. Single warm-paper look on purpose. */
:root {
  --desk: #f3e3c3;
  --desk-ink: #8a6a3c;
  --paper: #fffdf8;
  --ink: #2b2733;
  --tray: #e6cfa2;
  --accent: #e2475f;
  --sel: #2b2733;
  --font: "Noto Sans Georgian", "DejaVu Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  background: var(--desk);
  background-image: radial-gradient(rgba(138,106,60,.10) 1px, transparent 1.4px);
  background-size: 14px 14px;
  color: var(--ink);
  font-family: var(--font);
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  overflow: hidden;
}
.app {
  height: 100%;
  display: flex; flex-direction: column; gap: 10px;
  padding-block: 10px 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  max-width: 640px; margin: 0 auto; box-sizing: border-box;
}
header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; }
h1 { font-size: clamp(22px, 6vw, 30px); font-weight: 900; margin: 0; flex: 1 1 220px; min-width: 0; text-wrap: balance; letter-spacing: .01em; }
h1 span { color: var(--accent); }
.tool {
  border: 3px solid var(--ink); background: var(--paper); color: var(--ink);
  border-radius: 16px; height: 46px; min-width: 46px; padding: 0 10px;
  font: 700 15px var(--font); display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  box-shadow: 0 3px 0 var(--ink); cursor: pointer; transition: transform .08s;
}
.tool:active { transform: translateY(3px); box-shadow: 0 0 0 var(--ink); }
.tool svg { width: 22px; height: 22px; }
.tool[aria-pressed="true"] { background: var(--accent); color: #fff; }
.sheet-wrap { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; position: relative; container-type: size; }
.sheet {
  width: min(100cqw, 75cqh); aspect-ratio: 3 / 4; max-width: 100%;
  background: var(--paper); border-radius: 6px;
  box-shadow: 0 1px 0 rgba(0,0,0,.05), 0 10px 24px rgba(110,80,30,.22);
  transform: rotate(-.6deg); position: relative; overflow: hidden;
}
.page { width: 100%; height: 100%; }
.page svg { width: 100%; height: 100%; display: block; }
.pages { display: flex; gap: 8px; }
.pagebtn { flex: 1; border: 3px solid var(--ink); background: var(--paper); color: var(--ink); border-radius: 14px; height: 42px; font: 700 15px var(--font); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.pagebtn svg { width: 30px; height: 22px; }
.pagebtn[aria-selected="true"] { background: var(--ink); color: var(--paper); }
.sheet .r { cursor: pointer; transition: fill .15s; }
.sheet .ln, .sheet .hl { pointer-events: none; }
.sheet .pop { animation: pop .28s ease-out; transform-box: fill-box; transform-origin: center; }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.06); } 100% { transform: scale(1); } }
.ref {
  position: absolute; right: 8px; bottom: 8px; width: 34%; border: 4px solid #fff; border-radius: 4px;
  box-shadow: 0 6px 16px rgba(0,0,0,.25); transform: rotate(3deg); pointer-events: none;
}
.ref img { width: 100%; display: block; }
.ref p { margin: 0; position: absolute; left: 0; right: 0; bottom: -2px; background: #fff; font: 700 11px var(--font); text-align: center; padding: 3px 0 1px; }
.tray {
  background: var(--tray); border-radius: 18px; padding: 10px;
  box-shadow: inset 0 3px 0 rgba(0,0,0,.08);
  display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px;
}
.crayon {
  aspect-ratio: 1; width: 100%; border-radius: 50%; border: 3px solid var(--ink);
  background: var(--c); cursor: pointer; padding: 0; position: relative;
  box-shadow: inset -4px -5px 0 rgba(0,0,0,.18), inset 3px 3px 0 rgba(255,255,255,.35);
  transition: transform .12s;
}
.crayon[aria-checked="true"] { transform: scale(1.18) translateY(-3px); outline: 4px solid var(--paper); outline-offset: 1px; z-index: 1; }
.crayon.rainbow { background: conic-gradient(#ff5a5f, #ffb238, #ffe14d, #6fd36f, #4cb5f5, #8b6cf0, #ff5a5f); }
.status { font: 700 14px var(--font); color: var(--desk-ink); text-align: center; min-height: 1.3em; margin: 0; }
button:focus-visible { outline: 4px solid var(--accent); outline-offset: 2px; }
@media (max-width: 480px) { .tool .lbl { display: none; } .tools { flex-wrap: nowrap; } }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { .sheet .pop { animation: none; } .crayon, .tool { transition: none; } }
</style>

  <p class="status" id="status">აირჩიე ფერი და შეეხე სურათს</p>
  <div class="tray" id="tray" role="radiogroup" aria-label="ფერები"></div>
</div>

<script>
(() => {
  const COLORS = [
    ['#e2475f','წითელი'], ['#ff8fb1','ვარდისფერი'], ['#ff9a3c','ნარინჯისფერი'], ['#ffd93d','ყვითელი'],
    ['#7bd36a','მწვანე'], ['#2f9e5b','მუქი მწვანე'], ['#7cc8f5','ცისფერი'], ['#3a6fd8','ლურჯი'],
    ['#9b72e8','იისფერი'], ['#a8744f','ყავისფერი'], ['#d9d4e3','ღია ნაცრისფერი'], ['#8b8794','ნაცრისფერი'],
    ['#2b2733','შავი'], ['#ffffff','თეთრი'], ['#f6c7a1','ხორცისფერი'], ['rainbow','ჯადოსნური']
  ];
  const MAGIC = ['#ff5a5f','#ffb238','#ffe14d','#6fd36f','#4cb5f5','#8b6cf0','#ff8fb1'];
  const pages = [...document.querySelectorAll('#sheet .page')];
  pages.forEach(p => p.querySelectorAll('.r').forEach(el => el.setAttribute('fill', '#fff')));
  let page = pages[0], KEY = page.dataset.key, regions = [...page.querySelectorAll('.r')];
  const svg = document.getElementById('sheet');
  const tray = document.getElementById('tray');
  const status = document.getElementById('status');
  const eraser = document.getElementById('eraser');
  let current = COLORS[3][0], erasing = false, history = [], magicI = 0;

  COLORS.forEach(([c, name], i) => {
    const b = document.createElement('button');
    b.className = 'crayon' + (c === 'rainbow' ? ' rainbow' : '');
    if (c !== 'rainbow') b.style.setProperty('--c', c);
    b.setAttribute('role', 'radio'); b.setAttribute('aria-label', name); b.id = 'c' + i;
    b.setAttribute('aria-checked', c === current ? 'true' : 'false');
    b.onclick = () => {
      current = c; setEraser(false);
      tray.querySelectorAll('.crayon').forEach(x => x.setAttribute('aria-checked', x === b ? 'true' : 'false'));
      status.textContent = c === 'rainbow' ? 'ჯადოსნური ფერი: ყოველ შეხებაზე ახალი ფერია!' : name;
      blip(520 + i * 25);
    };
    tray.appendChild(b);
  });

  function setEraser(on) { erasing = on; eraser.setAttribute('aria-pressed', on); if (on) status.textContent = 'საშლელი: შეეხე იმას, რისი გასუფთავებაც გინდა'; }
  eraser.onclick = () => setEraser(!erasing);

  let ac;
  function blip(f) {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
      o.type = 'sine'; o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(f * 1.6, t + .08);
      g.gain.setValueAtTime(.12, t); g.gain.exponentialRampToValueAtTime(.001, t + .18);
      o.connect(g).connect(ac.destination); o.start(t); o.stop(t + .2);
    } catch (e) {}
  }

  function save() { try { localStorage.setItem(KEY, JSON.stringify(regions.map(r => r.getAttribute('fill')))); } catch (e) {} }
  function load() { try { const a = JSON.parse(localStorage.getItem(KEY) || 'null'); if (Array.isArray(a)) a.forEach((c, i) => regions[i] && regions[i].setAttribute('fill', c)); } catch (e) {} }

  svg.addEventListener('pointerdown', e => {
    const el = e.target.closest('.r'); if (!el || !page.contains(el)) return;
    let c = erasing ? '#ffffff' : current;
    if (c === 'rainbow') { c = MAGIC[magicI++ % MAGIC.length]; }
    const prev = el.getAttribute('fill');
    if (prev === c) return;
    history.push([el, prev]); if (history.length > 200) history.shift();
    el.setAttribute('fill', c);
    el.classList.remove('pop'); void el.getBBox(); el.classList.add('pop');
    blip(erasing ? 300 : 440 + Math.random() * 300);
    save();
  });

  document.getElementById('undo').onclick = () => {
    const h = history.pop(); if (!h) { status.textContent = 'დასაბრუნებელი აღარაფერია'; return; }
    h[0].setAttribute('fill', h[1]); save(); blip(330);
  };

  const clearBtn = document.getElementById('clear'); let armed = false, armT;
  clearBtn.onclick = () => {
    if (!armed) { armed = true; status.textContent = 'ყველაფერი წაიშლება. თავიდან დასაწყებად კიდევ ერთხელ დააჭირე'; clearTimeout(armT); armT = setTimeout(() => { armed = false; }, 3000); return; }
    armed = false;
    regions.forEach(r => { history.push([r, r.getAttribute('fill')]); r.setAttribute('fill', '#fff'); });
    save(); status.textContent = 'სუფთა ფურცელი მზადაა!'; blip(700);
  };

  const ref = document.getElementById('ref'), refBtn = document.getElementById('refBtn');
  refBtn.onclick = () => { ref.hidden = !ref.hidden; refBtn.setAttribute('aria-pressed', !ref.hidden); };

  pages.forEach(p => { page = p; KEY = p.dataset.key; regions = [...p.querySelectorAll('.r')]; load(); });
  function show(i) {
    page = pages[i]; KEY = page.dataset.key; regions = [...page.querySelectorAll('.r')]; history = [];
    pages.forEach((p, k) => { p.hidden = k !== i; });
    document.querySelectorAll('.pagebtn').forEach(b => b.setAttribute('aria-selected', b.dataset.p == i ? 'true' : 'false'));
    ref.querySelectorAll('img').forEach(im => { im.hidden = im.dataset.for != i; });
    status.textContent = page.dataset.name + ': აირჩიე ფერი და შეეხე სურათს';
    try { localStorage.setItem('feradi-page', i); } catch (e) {}
  }
  document.querySelectorAll('.pagebtn').forEach(b => b.onclick = () => { show(+b.dataset.p); blip(600); });
  let startPage = 0; try { startPage = +(localStorage.getItem('feradi-page') || 0) || 0; } catch (e) {}
  show(Math.min(startPage, pages.length - 1));
})();
</script>
